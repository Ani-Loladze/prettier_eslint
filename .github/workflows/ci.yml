name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run format

  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "UI and API tests would run here"